<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Appointment - Medguard</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background-color: #f8fafc;
    }
    .card {
      background: white;
      border-radius: 0.75rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .accent-color {
      color: #2dd4bf;
    }
    .accent-bg {
      background-color: #2dd4bf;
    }
  </style>
</head>
<body>
  {% include 'base.html' %}

  <div class="min-h-screen bg-gray-50 py-8">
    <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="card p-6">
        {% if appointment_booked %}
        <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" role="alert">
          <span class="block sm:inline"><i class="fas fa-check-circle mr-2"></i>Appointment booked successfully!</span>
        </div>
        {% endif %}
        <div class="mb-6">
          <h1 class="text-2xl font-bold text-gray-900">Book Appointment</h1>
          <p class="text-gray-600 mt-1">with Dr. {{ doctor.user_profile.user.get_full_name }}</p>
        </div>

        <div class="mb-6 p-4 bg-gray-50 rounded-lg">
          <h3 class="font-semibold text-gray-900 mb-2">Doctor Information</h3>
          <p class="text-gray-600"><strong>Specialization:</strong> {{ doctor.specialization }}</p>
          <p class="text-gray-600"><strong>License:</strong> {{ doctor.license_number }}</p>
        </div>

        <form method="post" action="{% url 'book_appointment' doctor.id %}">
          {% csrf_token %}
          <div class="mb-4">
            <label for="date" class="block text-gray-700 text-sm font-medium mb-1">Preferred Date & Time</label>
            <input type="datetime-local" id="date" name="date" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-teal-500">
          </div>

          <div class="mb-6">
            <label for="reason" class="block text-gray-700 text-sm font-medium mb-1">Reason for Visit</label>
            <textarea id="reason" name="reason" rows="4" required
                      class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-teal-500"
                      placeholder="Please describe your symptoms or reason for the appointment..."></textarea>
          </div>

          <div class="flex space-x-4">
            <button type="submit" class="flex-1 accent-bg text-white py-3 rounded-md font-medium hover:bg-teal-600 transition duration-200">
              Book Appointment
            </button>
            <a href="{% url 'connect_doctors' %}" class="flex-1 bg-gray-200 text-gray-700 py-3 rounded-md font-medium text-center hover:bg-gray-300 transition duration-200">
              Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
